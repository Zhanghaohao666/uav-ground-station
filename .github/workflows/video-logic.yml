name: Video logic checks (not a full application build)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  video-logic:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated test dependencies
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qtdeclarative5-dev qtdeclarative5-dev-tools qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2 qml-module-qtquick2 libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-libav libssl-dev python3-pip
      - name: Check offline licensing with disposable keys
        run: |
          python3 -m pip install -r tools/licensing/requirements.txt
          python3 -m unittest discover -s tests/licensing -p test_authority.py -v
          mkdir -p /tmp/offline-license-tests
          python3 tests/licensing/make_fixtures.py /tmp/offline-license-tests/fixtures.json
          cd /tmp/offline-license-tests
          qmake "$GITHUB_WORKSPACE/tests/licensing/licensing.pro"
          make -j2
          QT_QPA_PLATFORM=offscreen NEXUS_LICENSE_FIXTURES=/tmp/offline-license-tests/fixtures.json ./licensing_tests
      - name: Check QML syntax
        run: qmllint xsrc/XUI/XUI.qml xsrc/XUI/XBoardRecordingDialog.qml xsrc/XUI/XPayloadControlPanel.qml
      - name: Check production portable video environment isolation
        run: |
          mkdir -p /tmp/video-environment-build
          cd /tmp/video-environment-build
          qmake "$GITHUB_WORKSPACE/tests/video_environment/environment.pro"
          make -j2
          ./environment_tests
      - name: Compile real video lifecycle methods and preset JS with fake receivers
        working-directory: tests/video_demand
        run: |
          python3 generate_test_source.py
          qmake demand.pro
          make -j2
          QT_QPA_PLATFORM=offscreen ./demand_tests
      - name: Exercise actual GStreamer receiver and bounded decoded-frame queue
        run: |
          python3 tests/video_transport/rtsp_fixture.py > /tmp/uav-rtsp.log 2>&1 &
          uav_fixture_pid=$!
          trap 'kill "$uav_fixture_pid" 2>/dev/null || true' EXIT
          export UAV_TEST_RTSP_URL=rtsp://127.0.0.1:18554/test
          cd tests/video_receiver_native
          qmake receiver.pro
          make -j2
          ./receiver_tests
      - name: Compile real independent TCP controllers and control panels
        working-directory: tests/payload_controls
        run: |
          qmake payload.pro
          make -j2
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ./payload_tests
      - name: Compile real board recorder controller and QML panel
        working-directory: tests/board_recording
        run: |
          qmake recording.pro
          make -j2
          ./recording_tests
          qmake ui.pro -o Makefile.ui
          make -f Makefile.ui -j2
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ./recording_ui_tests
